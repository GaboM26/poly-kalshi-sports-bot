# Polytaoli - Prediction Market Arbitrage Application Configuration
# This is a configuration template. Copy it to config.toml and enter your credentials.

[kalshi]
# Kalshi API Key (obtain it from https://kalshi.com/profile/api)
api_key = "your-kalshi-api-key-here"

# Kalshi API Secret (RSA private key)
# Supports PKCS#1 format (-----BEGIN RSA PRIVATE KEY-----)
# Or PKCS#8 format (-----BEGIN PRIVATE KEY-----)
api_secret = """-----BEGIN RSA PRIVATE KEY-----
YOUR_KALSHI_PRIVATE_KEY_HERE
-----END RSA PRIVATE KEY-----"""

# Kalshi Trade API v2 base URL
base_url = "https://external-api.kalshi.com/trade-api/v2"

# Optional. Values shown are the defaults.
[kalshi.http]
timeout_secs = 10
# Total attempts for a GET that fails in transport (1 = no retry).
# Order placement is never retried.
max_attempts = 3

[polymarket]
# Polymarket US API configuration. Generate keys at https://polymarket.us/developer.
# This config file is ignored by Git once copied to config.toml.
# Preferably set via the POLYMARKET_KEY_ID / POLYMARKET_SECRET_KEY env vars
# instead of storing them here; these are only a fallback.
key_id = ""
secret_key = ""

# Polymarket US public gateway base URL (unauthenticated: events, sports, market book/detail)
base_url = "https://gateway.polymarket.us"

# Polymarket US authenticated API base URL (orders, account, portfolio)
# Requests are signed directly by the Rust backend (Ed25519) - no separate order service.
api_base_url = "https://api.polymarket.us"

# Optional. Values shown are the defaults.
[polymarket.http]
timeout_secs = 10
# Total attempts when the API answers 429 (1 = no retry). Rejections are never retried.
max_attempts = 3

[polymarket.cache]
balance_ttl_secs = 30
positions_ttl_secs = 30
# Tick size / minimum quantity per market; static, so cached long.
market_constraints_ttl_secs = 3600

[polymarket.ws]
# Reconnect when no frame arrives for this long.
silence_timeout_secs = 30
# How often the subscribed market set is re-read for hot-adds.
slug_refresh_secs = 5
# Ceiling of the exponential reconnect backoff.
max_backoff_secs = 30

# The [settings] and [auto_trade] configuration has moved to the database.
# It can be changed in real time through the frontend without restarting the service.
# The following are initial defaults, written to the database at first startup.

[settings]
# Data refresh interval (seconds)
refresh_interval = 3
# Minimum profit margin (%) for displaying arbitrage opportunities
min_profit_margin = 1.0
# Default amount (USD) used for arbitrage calculations
default_bet_amount = 10.0
# Profit-margin threshold (%) for starting tracking
tracking_threshold = 2.0

[auto_trade]
# Automated trading is disabled by default
enabled = false
# Maximum amount (USD) per automated trade
max_amount = 10.0
# Maximum number of automated trades
max_trade_count = 2
# Arbitrage opportunity duration threshold (milliseconds)
min_duration_ms = 500

# Cross-exchange sports (and crypto window) arbitrage. Optional: values shown
# are the defaults. Auto-trade limits (amount, count, contracts) live in the
# database and are edited in the UI, not here.
[sports_arb]
# Scans run on wall-clock multiples of the interval plus each offset.
market_scan_interval_secs = 300
market_scan_offsets_secs = [40, 100]
initial_scan_delay_secs = 30
# Kalshi and Polymarket events match only within this many hours.
match_window_hours = 24
# A Kalshi WebSocket book older than this is never used for sizing/execution.
executable_book_max_age_secs = 30
# The Polymarket WS book is trusted only while a frame arrived this recently.
polymarket_ws_max_silence_secs = 15
# IOC limits sit this many cents beyond the worst sized level (0-10).
limit_cushion_cents = 1
poly_depth_snapshot_cooldown_secs = 600
auto_trade_queue_check_ms = 200
auto_trade_pause_ms = 1000

[sports_arb.ended_markets]
kalshi_extreme_high = 0.99
kalshi_extreme_low = 0.02
poly_extreme_high = 1.0
poly_extreme_low = 0.0
extreme_duration_mins = 20
polymarket_missing_cycles = 2
cleanup_interval_secs = 60

# Scanned Kalshi series. Setting any entry replaces this whole list.
# category is the parser: NBA, TENNIS, NHL, MLB or CRYPTO15.
# auto_trade defaults to false: detection only. NHL and MLB stay detection-only
# until settlement equivalence is decided (Kalshi settles a game not played
# within 48h at a fair price; Polymarket US waits longer).
[[sports_arb.series]]
ticker = "KXNBAGAME"
category = "NBA"
label = "NBA"
auto_trade = true

[[sports_arb.series]]
ticker = "KXATPMATCH"
category = "TENNIS"
label = "ATP"
auto_trade = true

[[sports_arb.series]]
ticker = "KXWTAMATCH"
category = "TENNIS"
label = "WTA"
auto_trade = true

[[sports_arb.series]]
ticker = "KXITFMATCH"
category = "TENNIS"
label = "ITF M"
auto_trade = true

[[sports_arb.series]]
ticker = "KXITFWMATCH"
category = "TENNIS"
label = "ITF W"
auto_trade = true

[[sports_arb.series]]
ticker = "KXATPCHALLENGERMATCH"
category = "TENNIS"
label = "ATP Challenger"
auto_trade = true

[[sports_arb.series]]
ticker = "KXNHLGAME"
category = "NHL"
label = "NHL"
auto_trade = false

[[sports_arb.series]]
ticker = "KXMLBGAME"
category = "MLB"
label = "MLB"
auto_trade = false

[[sports_arb.series]]
ticker = "KXBTC15M"
