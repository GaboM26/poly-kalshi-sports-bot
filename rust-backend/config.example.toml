[auth]
# Web UI login authentication configuration
username = "admin"
password = "admin123"

# JWT key (change this to a random string of at least 32 characters)
secret_key = "your-secret-key-change-this-in-production-min-32-chars-long"

# Token expiration time (hours)
token_expire_hours = 24

[discord]
# Discord webhook notifications: trade results and new opportunities.
# Disabled by default. Create a webhook in Discord (channel settings >
# Integrations > Webhooks) and paste its URL. Keep it secret: anyone with the
# URL can post to the channel.
enabled = false
webhook_url = "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"

# Optional second webhook for executed-trade results only. Leave empty to post
# trades to the webhook above.
trades_webhook_url = ""

# Minimum profit margin (%) for an opportunity alert (one per market per minute)
opportunity_min_margin = 1.0
# At most one opportunity alert per market per this many seconds
opportunity_cooldown_secs = 60

# Independent directional Kalshi mention strategy. Kept separate from the
# paired arbitrage auto-trader and OFF by default.
[mention]
mode = "off" # off | paper | live (live also requires a passing current paper gate)
signal_url = "http://127.0.0.1:8765"
poll_interval_secs = 10
max_signal_age_secs = 60
bankroll_usd = 1000.0
kelly_fraction = 0.25
min_net_edge = 0.03
max_spread = 0.10
min_book_depth_contracts = 1
max_close_minutes = 15
allow_hold_to_settlement = false
# Only open positions before 00:00 US Eastern (conservatively 04:00 UTC) of the event date
# parsed from the ticker; tickers with no parseable date are rejected. Exits are always allowed.
pre_event_only = true
max_market_risk_pct = 0.01
max_event_risk_pct = 0.02
max_day_risk_pct = 0.03
max_total_open_risk_pct = 0.05
max_open_positions = 5
daily_loss_breaker_pct = 0.03
live_gate_min_days = 60
live_gate_max_age_days = 14
# A Kalshi WebSocket book older than this is not used for a decision
book_max_age_secs = 30
# Repeat an unchanged rejection reason in the decision log at most this often
rejection_log_interval_secs = 900
# HTTP timeout for the local signal service
signal_timeout_secs = 5
